<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Industrial process monitor</title><script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script><style>body{font:16px system-ui;max-width:1000px;margin:2rem auto;padding:0 1rem;background:#f4f6f9;color:#152033}.cards{display:flex;gap:1rem;flex-wrap:wrap}.card{background:white;padding:1rem 1.4rem;border-radius:10px;min-width:150px;box-shadow:0 2px 10px #0001}.muted{color:#566}.chart{background:white;margin-top:1rem;border-radius:10px}</style></head>
<body><h1>Industrial Automation Monitor</h1><p class="muted">Loopback PLC simulator only. Values are synthetic; no real controller is connected.</p><section class="cards"><div class="card">Temperature<h2 id="temperature">—</h2></div><div class="card">Pressure<h2 id="pressure">—</h2></div><div class="card">Motor speed<h2 id="motor">—</h2></div><div class="card">Tank level<h2 id="tank">—</h2></div></section><h3 id="alarm">No active alarms</h3><div id="chart" class="chart"></div><script>async function refresh(){const p=await fetch('/process').then(r=>r.json()),h=await fetch('/history?limit=60').then(r=>r.json());const v=p.values;document.querySelector('#temperature').textContent=v.temperature_c.toFixed(1)+' °C';document.querySelector('#pressure').textContent=v.pressure_kpa.toFixed(0)+' kPa';document.querySelector('#motor').textContent=v.motor_rpm.toFixed(0)+' rpm';document.querySelector('#tank').textContent=v.tank_percent.toFixed(1)+' %';document.querySelector('#alarm').textContent=p.alarms.join(' · ')||'No active alarms';if(h.length)Plotly.react('chart',[{x:h.map(x=>x.timestamp),y:h.map(x=>x.temperature_c),name:'Temperature °C'},{x:h.map(x=>x.timestamp),y:h.map(x=>x.pressure_kpa),name:'Pressure kPa',yaxis:'y2'}],{title:'Recent process trend',yaxis:{title:'°C'},yaxis2:{title:'kPa',overlaying:'y',side:'right'},margin:{t:50}})}refresh();setInterval(refresh,1500)</script></body></html>
