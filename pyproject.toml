[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "industrial-automation-monitor"
version = "0.1.0"
description = "Modbus TCP process monitoring, alarms, and history for a simulated PLC"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pymodbus>=3.7,<4", "sqlalchemy>=2.0,<3"]
[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
[project.scripts]
plant-monitor = "plant_monitor.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
plant_monitor = ["dashboard.html"]
